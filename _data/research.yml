# Research highlight cards shown on the homepage.
# Each entry: title, description, technologies (list), project (current/related work).

- title: "Applied Mathematics"
  description: "Pure mathematics and functional analysis as a foundation for modeling real systems, from finite structures to continuous dynamics."
  technologies: ["Functional Analysis", "Group Theory", "Differential Equations"]
  project: "Character Theory in Finite Fields"

- title: "Numerical Analysis"
  description: "Discretization and stability of PDE/ODE systems, from finite differences to operator splitting schemes."
  technologies: ["Finite Differences", "Operator Splitting", "Lax-Friedrichs"]
  project: "Westervelt equation simulations, LAMIA"

- title: "Scientific Computing"
  description: "Reproducible numerical simulation of physical and environmental systems, from ultrasound propagation to atmospheric flow."
  technologies: ["Python", "C++", "Symbolic & Numerical Methods"]
  project: "Cyclone flow modeling, MEMIAD"

- title: "Mathematical Modelling"
  description: "Compartmental and non-autonomous ODE systems for environmental transfer and exposure dynamics under seasonal forcing."
