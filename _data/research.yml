- title: "Healthcare Data"
  description: "Data-driven decision support for clinical and public-health contexts, from triage prioritization to exposure modeling."
  technologies: ["Random Forest", "Risk Scoring", "Python"]
  project: "Medical Triage System"

- title: "Biostatistics"
  description: "Statistical inference and predictive modeling for health and environmental data, strengthened through the Master's Environment & Health specialization and applied work on healthcare data."
  technologies: ["Statistical Inference", "Predictive Modeling", "R"]
